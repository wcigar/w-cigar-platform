      { id: 'training', name: '教育訓練與考核', icon: 'fa-graduation-cap', color: 'from-emerald-700 to-emerald-900' },

    ];

    function App() {
      const [appInited, setAppInited] = useState(false);
      const [user, setUser] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [activeReg, setActiveReg] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminPanel, setShowAdminPanel] = useState(false);
      const [message, setMessage] = useState(null);
      const [questionText, setQuestionText] = useState('');
      const [dbInfo, setDbInfo] = useState({ db: null, auth: null });

      const [form, setForm] = useState({ id: '', title: '', content: '', category: 'admin', imageUrl: '' });

      useEffect(() => {
        const timer = setInterval(() => {
          if (window.FirebaseAPI) {
            clearInterval(timer);
            try {
              const app = window.FirebaseAPI.initializeApp(firebaseConfig);
              const db = window.FirebaseAPI.getFirestore(app);
              const auth = window.FirebaseAPI.getAuth(app);
              setDbInfo({ db, auth });
              setAppInited(true);
            } catch (e) {
              console.error("Firebase 初始化失敗。請確認設定檔。", e);
            }
          }
        }, 100);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (!appInited) return;
        const { db, auth } = dbInfo;
        const { signInAnonymously, onAuthStateChanged, collection, query, onSnapshot, doc, setDoc } = window.FirebaseAPI;

        signInAnonymously(auth).catch(e => console.error(e));
        
        const unsubAuth = onAuthStateChanged(auth, (u) => u && setUser(u));

        const path = `/artifacts/${APP_ID}/public/data/regulations`;
        const q = query(collection(db, path));
        
        const unsubDb = onSnapshot(q, (snapshot) => {
          if (snapshot.empty) {
            console.log("偵測到空資料庫，正在初始化 V19 完全體版...");
            INITIAL_DATA.forEach(async (item) => {
              await setDoc(doc(db, path, item.id), {
                ...item,
                updatedAt: new Date().toISOString()
              });
            });
          } else {
            const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => {
               const numA = parseInt(a.id.split('-').pop());
               const numB = parseInt(b.id.split('-').pop());
               return numA - numB;
            });
            setRegulations(data);
          }
        });

        return () => { unsubAuth(); unsubDb(); };
      }, [appInited]);

      const filteredRegs = useMemo(() => {
        return regulations.filter(reg => {
          const matchesSearch = reg.title?.toLowerCase().includes(searchTerm.toLowerCase()) || 
                              reg.content?.toLowerCase().includes(searchTerm.toLowerCase());
          const matchesCategory = selectedCategory === 'all' || reg.category === selectedCategory;
          return matchesSearch && matchesCategory;
        });
      }, [regulations, searchTerm, selectedCategory]);

      const progress = useMemo(() => {
        if (regulations.length === 0) return 0;
        const readCount = regulations.filter(r => r.viewCount > 0).length;
        return Math.round((readCount / regulations.length) * 100);
      }, [regulations]);

      const showToast = (txt) => {
        setMessage(txt);
        setTimeout(() => setMessage(null), 3000);
      };

      const handleSave = async (e) => {
        e.preventDefault();
        const { db } = dbInfo;
        const { doc, setDoc } = window.FirebaseAPI;
        const id = form.id || `sop-custom-${Date.now()}`;
        const path = `/artifacts/${APP_ID}/public/data/regulations`;
        try {
          await setDoc(doc(db, path, id), {
            ...form, id, updatedAt: new Date().toISOString(),
            viewCount: form.viewCount || 0, comments: form.comments || []
          }, { merge: true });
          showToast("規章已同步至雲端");
          setShowAdminPanel(false);
          setForm({ id: '', title: '', content: '', category: 'admin', imageUrl: '' });
        } catch (e) { showToast("權限不足或網路錯誤"); }
      };

      const handleDelete = async (id) => {
        if(!confirm("確定要刪除這條規章嗎？")) return;
        const { db } = dbInfo;
        const { doc, deleteDoc } = window.FirebaseAPI;
        const path = `/artifacts/${APP_ID}/public/data/regulations`;
        try {
          await deleteDoc(doc(db, path, id));
          showToast("已刪除該制度");
        } catch (e) { showToast("刪除失敗"); }
      };

      const handleAddComment = async () => {
        if (!questionText.trim()) return;
        const { db } = dbInfo;
        const { doc, updateDoc, arrayUnion } = window.FirebaseAPI;
        const path = `/artifacts/${APP_ID}/public/data/regulations`;
        try {
          await updateDoc(doc(db, path, activeReg.id), {
            comments: arrayUnion({
              user: user?.uid.substring(0, 6) || 'Guest',
              text: questionText,
              time: new Date().toISOString(),
              isAdmin: isAdmin
            })
          });
          setQuestionText('');
          showToast("問題已送出，管理者將盡快回覆");
        } catch (e) { showToast("傳送失敗"); }
      };

      const renderContentWithLinks = (text) => {
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return text.split(urlRegex).map((part, i) => {
          if (part.match(urlRegex)) {
            return (
              <a key={i} href={part} target="_blank" rel="noopener noreferrer" 
                 className="text-amber-500 underline hover:text-amber-300 break-all font-bold">
                {part}
              </a>
            );
          }
          return <span key={i}>{part}</span>;
        });
      };

      if (!appInited) return <div className="min-h-screen bg-[#0f0d0c] flex items-center justify-center text-amber-500 font-serif text-2xl animate-pulse">Initializing System...</div>;

      return (
        <div className="min-h-screen bg-[#0f0d0c] text-stone-300 font-sans selection:bg-amber-800/30">
          
          <div className="bg-[#1a1614] border-b border-amber-900/10 py-2 overflow-hidden shadow-sm">
            <div className="flex items-center gap-12 animate-marquee whitespace-nowrap">
              {[1,2,3].map(i => (
                <span key={i} className="flex items-center gap-3 text-[10px] font-bold text-amber-600/80 uppercase tracking-[0.3em]">
                  <i className="fas fa-sparkles text-xs"></i> W CIGAR BAR CAPADURA • 卓越是我們的唯一標準 • 尊重雪茄，尊重賓客
                </span>
              ))}
            </div>
          </div>

          <header className="sticky top-0 z-50 bg-[#0f0d0c]/90 backdrop-blur-2xl border-b border-white/5 px-6 py-4 flex items-center justify-between shadow-2xl">
            <div className="flex items-center gap-5">
              <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 lg:hidden text-stone-500 hover:text-amber-500 transition-colors">
                <i className={`fas ${isSidebarOpen ? 'fa-times' : 'fa-bars'} text-xl`}></i>
              </button>
              <div className="flex flex-col">
                <h1 className="text-xl md:text-2xl font-serif italic tracking-tighter text-amber-100">
                  W CIGAR <span className="text-amber-500 not-italic font-sans font-black uppercase tracking-widest ml-1">Elite</span>
                </h1>
                <div className="flex items-center gap-2 mt-0.5">
                  <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                  <p className="text-[8px] text-stone-500 tracking-[0.4em] font-bold uppercase">System Online • 獨立下載與合約整合版</p>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="hidden md:flex flex-col items-end mr-4">
                <span className="text-[10px] font-bold text-stone-500 uppercase tracking-widest">我的學習進度</span>
                <div className="w-32 h-1 bg-stone-800 rounded-full mt-1 overflow-hidden">
                  <div className="h-full bg-amber-500 transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                </div>
              </div>
              <button 
                onClick={() => {
                  if (isAdmin) {
                    setIsAdmin(false);
                    showToast("已登出管理員模式");
                  } else {
                    const pwd = prompt("【權限驗證】\n請輸入店長專屬密碼：");
                    if (pwd === "w168") {
                      setIsAdmin(true);
                      showToast("管理員身分驗證成功");
                    } else if (pwd !== null) {
                      alert("密碼錯誤！這不是您可以亂按的地方喔 🚬");
                    }
                  }
                }}
                className={`flex items-center gap-2 px-4 py-2 rounded-full border text-[10px] font-bold transition-all ${isAdmin ? 'bg-amber-600 border-amber-500 text-white shadow-lg shadow-amber-900/40' : 'border-stone-800 text-stone-500 hover:border-amber-900/50 hover:text-stone-300'}`}
              >
                <i className={`fas fa-cog ${isAdmin ? 'animate-spin-slow' : ''}`}></i>
                {isAdmin ? 'ADMIN ACTIVE' : 'MANAGER LOGIN'}
              </button>
            </div>
          </header>

          <div className="max-w-[1800px] mx-auto flex h-[calc(100vh-84px)]">
            
            <aside className={`
              fixed lg:relative inset-y-0 left-0 z-40 w-80 bg-[#0a0908] border-r border-white/5 
              transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} 
              lg:translate-x-0 transition-transform duration-700 p-8 flex flex-col
            `}>
              <div className="mb-12">
                <div className="flex items-center gap-4 mb-8 p-4 bg-stone-900/30 rounded-2xl border border-white/5">
                  <div className="w-12 h-12 rounded-full bg-gradient-to-br from-amber-500 to-amber-900 flex items-center justify-center shadow-inner">
                    <i className="fas fa-user text-white text-xl"></i>
                  </div>
                  <div>
                    <p className="text-xs font-bold text-amber-500 uppercase tracking-widest">Staff Portal</p>
                    <p className="text-[10px] text-stone-500 font-mono mt-0.5">UID: {user?.uid.substring(0,8) || 'Wait'}</p>
                  </div>
                </div>

                <h2 className="text-[9px] font-black text-stone-600 uppercase tracking-[0.5em] mb-6 px-2 italic">Essential Navigation</h2>
                <nav className="space-y-2">
                  <button 
                    onClick={() => { setSelectedCategory('all'); setIsSidebarOpen(false); }}
                    className={`w-full flex items-center justify-between px-4 py-3.5 rounded-xl text-sm transition-all group ${selectedCategory === 'all' ? 'bg-[#1a1614] text-amber-500 border border-amber-900/20' : 'text-stone-500 hover:text-stone-200'}`}
                  >
                    <div className="flex items-center gap-3">
                      <i className="fas fa-file-alt"></i>
                      <span className="font-bold">全部規章</span>
                    </div>
                    <span className="text-[10px] bg-stone-800 px-2 py-0.5 rounded text-stone-400">{regulations.length}</span>
                  </button>
                </nav>
              </div>

              <div className="flex-1 overflow-y-auto custom-scrollbar pr-2">
                <h2 className="text-[9px] font-black text-stone-600 uppercase tracking-[0.5em] mb-6 px-2 italic">Policy Categories</h2>
                <nav className="space-y-1.5">
                  {CATEGORIES.map(cat => (
                    <button 
                      key={cat.id}
                      onClick={() => { setSelectedCategory(cat.id); setIsSidebarOpen(false); }}
                      className={`w-full flex items-center gap-4 px-4 py-3.5 rounded-xl text-sm transition-all group relative overflow-hidden ${selectedCategory === cat.id ? 'text-amber-100' : 'text-stone-500 hover:text-stone-300'}`}
                    >
                      {selectedCategory === cat.id && <div className={`absolute inset-0 bg-gradient-to-r ${cat.color} opacity-20`}></div>}
                      <div className={`p-2 rounded-lg w-8 h-8 flex items-center justify-center bg-stone-900 group-hover:bg-stone-800 transition-colors ${selectedCategory === cat.id ? 'text-amber-500' : ''}`}>
                        <i className={`fas ${cat.icon}`}></i>
                      </div>
                      <span className="font-bold tracking-wide relative z-10">{cat.name}</span>
                    </button>
                  ))}
                </nav>
              </div>
            </aside>

            <main className="flex-1 overflow-y-auto bg-[#0f0d0c] p-6 lg:p-16 custom-scrollbar relative">
              <div className="max-w-5xl mx-auto relative z-10">
                <div className="flex flex-col md:flex-row gap-6 mb-16 items-center">
                  <div className="relative flex-1 w-full">
                    <div className="absolute left-6 top-1/2 -translate-y-1/2 text-amber-900/50">
                      <i className="fas fa-search text-lg"></i>
                    </div>
                    <input 
                      type="text"
                      placeholder="搜尋規章條文、表單連結或教育訓練..."
                      className="w-full bg-[#161311] border border-white/5 rounded-3xl py-6 pl-16 pr-8 text-stone-200 focus:outline-none focus:border-amber-900/30 focus:ring-8 focus:ring-amber-900/5 transition-all shadow-2xl placeholder:text-stone-700 text-lg"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                    />
                  </div>
                  
                  {isAdmin && (
                    <button 
                      onClick={() => { setForm({ id: '', title: '', content: '', category: 'admin', imageUrl: '' }); setShowAdminPanel(true); }}
                      className="w-full md:w-auto flex items-center justify-center gap-3 bg-gradient-to-br from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 text-white px-10 py-6 rounded-3xl font-black uppercase text-xs tracking-widest transition-all shadow-2xl shadow-amber-900/30 active:scale-95"
                    >
                      <i className="fas fa-plus"></i> 撰寫新制度
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {filteredRegs.length > 0 ? (
                    filteredRegs.map(reg => (
                      <div 
                        key={reg.id}
                        onClick={() => setActiveReg(reg)}
                        className="group bg-gradient-to-b from-[#1a1614] to-[#120f0e] border border-white/5 rounded-[2.5rem] p-8 hover:border-amber-900/30 transition-all cursor-pointer relative overflow-hidden shadow-xl"
                      >
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        
                        <div className="flex items-center justify-between mb-8">
                          <span className={`px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest bg-gradient-to-r ${CATEGORIES.find(c => c.id === reg.category)?.color} text-white shadow-lg`}>
                            {CATEGORIES.find(c => c.id === reg.category)?.name}
                          </span>
                          {reg.viewCount > 0 && <i className="fas fa-check-circle text-green-800/50 text-lg"></i>}
                        </div>

                        <h3 className="text-2xl font-serif text-amber-100 mb-4 group-hover:text-amber-400 transition-colors leading-tight">{reg.title}</h3>
                        <p className="text-stone-500 leading-relaxed line-clamp-2 text-sm font-light italic whitespace-pre-line">
                          {reg.content}
                        </p>

                        <div className="mt-8 flex items-center justify-between pt-6 border-t border-white/5">
                          <div className="flex items-center gap-4">
                            <span className="text-[10px] text-stone-600 font-bold uppercase"><i className="fas fa-eye mr-1"></i> {reg.viewCount || 0} 已閱</span>
                            <span className="text-[10px] text-stone-600 font-bold uppercase"><i className="fas fa-comment mr-1"></i> {reg.comments?.length || 0} 討論</span>
                          </div>
                          <div className="flex items-center gap-2 text-amber-600 group-hover:translate-x-1 transition-transform">
                            <span className="text-[10px] font-black uppercase tracking-tighter">閱讀全文</span>
                            <i className="fas fa-chevron-right text-xs"></i>
                          </div>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="col-span-full py-32 text-center bg-[#161311] rounded-[3rem] border border-dashed border-white/5">
                      <div className="w-20 h-20 bg-stone-900 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i className="fas fa-search text-3xl text-stone-700"></i>
                      </div>
                      <h4 className="text-stone-400 font-serif italic text-xl">「在這片煙霧中，尚未尋得您所求」</h4>
                    </div>
                  )}
                </div>
              </div>
            </main>
          </div>

          {showAdminPanel && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/95 backdrop-blur-md" onClick={() => setShowAdminPanel(false)}></div>
              <div className="relative w-full max-w-2xl bg-[#161311] border border-amber-900/20 rounded-[3rem] shadow-2xl overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-1 bg-amber-500"></div>
                <form onSubmit={handleSave} className="p-10">
                  <div className="flex justify-between items-center mb-10">
                    <h2 className="text-3xl font-serif italic text-white tracking-tight">策劃規章內容</h2>
                    <button type="button" onClick={() => setShowAdminPanel(false)} className="p-2 text-stone-600 hover:text-white"><i className="fas fa-times text-2xl"></i></button>
                  </div>

                  <div className="space-y-8">
                    <div className="grid grid-cols-2 gap-4">
                      <div className="col-span-2">
                        <label className="text-[10px] font-black text-amber-600 uppercase tracking-widest block mb-3 px-1">規章標題</label>
                        <input required className="w-full bg-[#0a0908] border border-white/5 rounded-2xl p-5 text-stone-100 focus:outline-none focus:border-amber-900/50 transition-all" value={form.title} onChange={(e) => setForm({...form, title: e.target.value})} placeholder="標題需簡潔有力..."/>
                      </div>
                      {CATEGORIES.map(c => (
                        <button key={c.id} type="button" onClick={() => setForm({...form, category: c.id})} className={`py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest transition-all border ${form.category === c.id ? 'bg-amber-600 text-white border-amber-500 shadow-xl' : 'bg-[#0a0908] text-stone-600 border-white/5 hover:border-stone-700'}`}>
                          {c.name}
                        </button>
                      ))}
                    </div>
                    <div>
                      <label className="text-[10px] font-black text-amber-600 uppercase tracking-widest block mb-3 px-1">圖鑑 URL (可選)</label>
                      <div className="relative">
                        <i className="fas fa-image absolute left-4 top-1/2 -translate-y-1/2 text-stone-700"></i>
                        <input className="w-full bg-[#0a0908] border border-white/5 rounded-2xl p-5 pl-12 text-stone-100 focus:outline-none focus:border-amber-900/50 transition-all" value={form.imageUrl} onChange={(e) => setForm({...form, imageUrl: e.target.value})} placeholder="https://..."/>
                      </div>
                    </div>
                    <div>
                      <label className="text-[10px] font-black text-amber-600 uppercase tracking-widest block mb-3 px-1">詳細條文</label>
                      <textarea required rows={6} className="w-full bg-[#0a0908] border border-white/5 rounded-2xl p-5 text-stone-300 focus:outline-none focus:border-amber-900/50 transition-all resize-none leading-relaxed" value={form.content} onChange={(e) => setForm({...form, content: e.target.value})} placeholder="請輸入制度細節，貼上網址會自動變成連結..."/>
                    </div>
                  </div>

                  <div className="mt-12 flex gap-4">
                    <button type="submit" className="flex-1 py-6 rounded-3xl bg-white text-black font-black uppercase text-xs tracking-[0.2em] shadow-2xl hover:bg-amber-500 hover:text-white transition-all">確認發佈制度</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {activeReg && (
            <div className="fixed inset-0 z-[65] flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/98 backdrop-blur-xl" onClick={() => setActiveReg(null)}></div>
              <div className="relative w-full max-w-4xl max-h-[90vh] flex flex-col bg-[#0f0d0c] border border-white/5 rounded-[4rem] overflow-hidden shadow-2xl">
                <div className={`h-2 bg-gradient-to-r ${CATEGORIES.find(c => c.id === activeReg.category)?.color}`}></div>
                
                <div className="flex-1 overflow-y-auto custom-scrollbar p-10 md:p-20">
                  <div className="flex justify-between items-start mb-12">
                    <div>
                      <span className="text-[10px] font-black text-amber-500 uppercase tracking-[0.6em] block mb-4">W CIGAR SOP</span>
                      <h2 className="text-4xl md:text-5xl font-serif italic text-amber-50 tracking-tight leading-tight">{activeReg.title}</h2>
                    </div>
                    <button onClick={() => setActiveReg(null)} className="p-4 text-stone-700 hover:text-white"><i className="fas fa-times text-2xl"></i></button>
                  </div>

                  {activeReg.imageUrl && (
                    <div className="mb-12 rounded-[2rem] overflow-hidden border border-white/5 shadow-2xl">
                      <img src={activeReg.imageUrl} alt="SOP Visual" className="w-full h-auto object-cover max-h-[400px]" onError={(e) => e.target.style.display = 'none'} />
                    </div>
                  )}

                  <div className="prose prose-invert max-w-none mb-16">
                    <div className="bg-[#161311] border border-white/5 p-10 md:p-14 rounded-[3rem] whitespace-pre-wrap text-stone-300 text-xl leading-relaxed font-light shadow-inner relative overflow-hidden">
                       <i className="fas fa-crown absolute top-10 right-10 text-6xl text-amber-500 opacity-5"></i>
                       {renderContentWithLinks(activeReg.content)}
                    </div>
                  </div>

                  <div className="border-t border-white/5 pt-16">
                    <div className="flex items-center gap-3 mb-10">
                      <i className="fas fa-comments text-amber-600 text-2xl"></i>
                      <h3 className="text-xl font-bold text-white uppercase tracking-widest">實務問答 Clarification</h3>
                    </div>

                    <div className="space-y-6 mb-10">
                      {activeReg.comments && activeReg.comments.length > 0 ? activeReg.comments.map((c, i) => (
                        <div key={i} className={`flex gap-4 p-6 rounded-3xl ${c.isAdmin ? 'bg-amber-900/10 border border-amber-900/20 ml-12' : 'bg-stone-900/50 border border-white/5 mr-12'}`}>
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${c.isAdmin ? 'bg-amber-600 text-white' : 'bg-stone-800 text-stone-500'}`}>
                            <i className="fas fa-user"></i>
                          </div>
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-[10px] font-black text-amber-500 uppercase tracking-widest">{c.isAdmin ? 'Manager Answer' : `Staff #${c.user}`}</span>
                              <span className="text-[9px] text-stone-600">{new Date(c.time).toLocaleTimeString()}</span>
                            </div>
                            <p className="text-stone-300 text-sm leading-relaxed">{c.text}</p>
                          </div>
                        </div>
                      )) : <div className="text-center py-10 text-stone-600 text-sm italic">尚無提問。</div>}
                    </div>

                    <div className="relative group">
                      <input type="text" placeholder="對此規章有疑問？請在此輸入..." className="w-full bg-[#0a0908] border border-white/5 rounded-2xl py-5 pl-6 pr-20 text-stone-200 focus:outline-none focus:border-amber-900/50" value={questionText} onChange={(e) => setQuestionText(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleAddComment()}/>
                      <button onClick={handleAddComment} className="absolute right-3 top-1/2 -translate-y-1/2 p-3 bg-amber-600 text-white rounded-xl hover:bg-amber-500"><i className="fas fa-paper-plane"></i></button>
                    </div>
                  </div>
                </div>

                <div className="bg-[#120f0e] border-t border-white/5 p-8 md:px-20 flex justify-between items-center">
                   <div className="text-stone-600 text-[10px] font-bold uppercase tracking-[0.2em]">最後審訂：{new Date(activeReg.updatedAt).toLocaleDateString()}</div>
                   <div className="flex gap-4">
                     {isAdmin && <button onClick={() => { handleDelete(activeReg.id); setActiveReg(null); }} className="px-10 py-5 text-red-800 text-[10px] tracking-widest hover:bg-red-900/20 rounded-xl transition-colors">刪除此制度</button>}
                     <button onClick={async () => {
                        const { db } = dbInfo;
                        await window.FirebaseAPI.updateDoc(window.FirebaseAPI.doc(db, `/artifacts/${APP_ID}/public/data/regulations`, activeReg.id), { viewCount: (activeReg.viewCount || 0) + 1 });
                        setActiveReg(null);
                        showToast("您已簽署確認閱讀");
                      }} className="bg-white text-black px-16 py-5 rounded-2xl text-xs font-black tracking-[0.2em] hover:bg-amber-500 hover:text-white">
                        <i className="fas fa-check-circle mr-2"></i>確認閱讀並遵守
                      </button>
                   </div>
                </div>
              </div>
            </div>
          )}

          {message && <div className="fixed bottom-12 left-1/2 -translate-x-1/2 z-[100] px-8 py-4 bg-amber-600 text-white rounded-full text-[10px] tracking-[0.2em] font-black uppercase"><i className="fas fa-bell mr-2"></i>{message}</div>}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
